<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scoring Stats</title>
<!--
  Live scoring stats (2026-11-05). Reads the same public data as the scorer page (../index.html):
  R2 <base>/s/<key>/manifest.json = the clips online for each scorer (open parts only), and Firestore
  scoring/<key>/answers = their answers. "Left" = manifest rows not done; "Scored" = answer docs that are done
  (tags_right + type, plus fight_level + winner for fights; same rule as the scorer and lb_share.done_row).
  "Clips online" counts each code once (calibration codes are shared). Refreshes every 60 s.
-->
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#111827;--muted:#4b5563;--line:#e5e7eb;--blue:#1d4ed8;--green:#15803d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{font-weight:600;font-size:18px;color:var(--blue);text-decoration:none;border:2px solid #d1d5db;border-radius:12px;padding:8px 14px;background:#fff}
.big{background:var(--panel);border-radius:20px;padding:22px 26px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.big .n{font-size:96px;font-weight:800;line-height:1}
.big .lab{font-size:30px;font-weight:700;color:var(--muted)}
.chart{background:var(--panel);border-radius:20px;padding:20px 26px 24px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.chart h2{margin:0 0 14px;font-size:38px}
.row{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:14px;margin:12px 0}
.name{font-size:30px;font-weight:700}
.track{position:relative;height:64px;background:#f3f4f6;border-radius:12px}
.bar{height:100%;border-radius:12px;min-width:6px;transition:width .6s ease}
.left .bar{background:var(--blue)}
.scored .bar{background:var(--green)}
.val{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;font-weight:800;padding:0 14px}
.val.in{color:#fff}
.stamp{color:var(--muted);font-size:17px;margin-top:6px}
.err{color:#b91c1c;font-weight:600}
@media (max-width:640px){
  .big .n{font-size:72px}
  .chart h2{font-size:30px}
  .row{grid-template-columns:5.2em 1fr;gap:10px}
  .name{font-size:24px}
  .track{height:52px}
  .val{font-size:28px}
}
</style>
</head>
<body>
<main>
<header>
  <a class="back" href="../" id="backLink">Back to scoring</a>
  <span class="stamp" id="stamp">Loading</span>
</header>

<div class="big"><div class="n" id="online">&ndash;</div><div class="lab">Clips online</div></div>

<section class="chart left"><h2>Clips left</h2><div id="leftRows"></div></section>
<section class="chart scored"><h2>Clips scored</h2><div id="scoredRows"></div></section>
</main>

<script>
"use strict";
(() => {
const R2_BASE = "https://clips.brysonloflin.com";
const API_KEY = "AIzaSyBosL_Hib9s81f4Hlhw3GLq_XZDNkZEnSk";
const PROJECT = "bryson-website-games";
const WHO = {                                   // same keys as the scorer page (CONTRACT.md v2)
  Laura: "hf65vyb7cd45nfxm87d8nddy",
  Dante: "aazm3zcrsmtmjsnkxcdvg5xm",
  Bryson: "3f4ke72hhgc43nh7ka6pwzxk",
  Other: "fpt2j5gzw9zhps9923hrs9qw"            // was Tobias until 11/5; anyone else, one shared pool
};
const $ = id => document.getElementById(id);
if (location.search) $("backLink").href = "../" + location.search;

function done(a) {
  if (!a.tags_right || !a.type) return false;
  if (a.type === "fight") return !!a.fight_level && !!a.winner;
  return true;
}
async function manifest(key) {
  const r = await fetch(`${R2_BASE}/s/${key}/manifest.json`, { cache: "no-store" });
  if (r.status === 404) return { parts: [] };
  if (!r.ok) throw new Error("manifest " + r.status);
  return r.json();
}
async function answers(key) {
  const out = {};
  let token = "";
  do {
    const u = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/scoring/${key}/answers`
      + `?key=${API_KEY}&pageSize=300` + (token ? `&pageToken=${encodeURIComponent(token)}` : "");
    const r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error("answers " + r.status);
    const j = await r.json();
    for (const d of j.documents || []) {
      const f = {};
      for (const [k, v] of Object.entries(d.fields || {})) f[k] = v.stringValue ?? v.integerValue ?? "";
      out[d.name.split("/").pop()] = f;
    }
    token = j.nextPageToken || "";
  } while (token);
  return out;
}
function bars(el, cls, data) {
  const max = Math.max(1, ...data.map(d => d.n));
  el.innerHTML = data.map(d => {
    const pct = 100 * d.n / max, inside = pct > 18;
    return `<div class="row"><span class="name">${d.name}</span><div class="track">`
      + `<div class="bar" style="width:${pct}%"></div>`
      + `<span class="val ${inside ? "in" : ""}" style="${inside ? "left:0" : `left:${pct}%`}">${d.n}</span></div></div>`;
  }).join("");
}
async function refresh() {
  try {
    const names = Object.keys(WHO);
    const res = await Promise.all(names.map(async n => {
      const [m, a] = await Promise.all([manifest(WHO[n]), answers(WHO[n])]);
      const codes = (m.parts || []).flatMap(p => (p.rows || []).map(r => r.code));
      return { name: n, codes, left: codes.filter(c => !(a[c] && done(a[c]))).length,
               scored: Object.values(a).filter(done).length };
    }));
    $("online").textContent = new Set(res.flatMap(r => r.codes)).size;
    bars($("leftRows"), "left", res.map(r => ({ name: r.name, n: r.left })));
    bars($("scoredRows"), "scored", res.map(r => ({ name: r.name, n: r.scored })));
    $("stamp").className = "stamp";
    $("stamp").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) {
    $("stamp").className = "stamp err";
    $("stamp").textContent = "Offline, retrying";
  }
}
refresh();
setInterval(refresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
