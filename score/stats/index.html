<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scoring Stats</title>
<!--
  Live scoring stats (2026-11-05, v2: one fights bar + scored per person, fits a desktop screen).
  Fights bar: R2 stats.json {fights, fights_scored} written every 10 min on the lab Mac by
  BatReID/laura_batches/lb_stats.py (which codes are fights is pipeline data, so only totals reach this page).
  Per person: Firestore scoring/<key>/answers that are done (tags_right + type, plus fight_level + winner for
  fights; same rule as the scorer and lb_share.done_row). Refreshes every 60 s.
-->
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#111827;--muted:#4b5563;--line:#e5e7eb;--blue:#1d4ed8;--green:#15803d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1500px;margin:0 auto;padding:18px 28px;min-height:100vh;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{font-weight:600;font-size:18px;color:var(--blue);text-decoration:none;border:2px solid #d1d5db;border-radius:12px;padding:8px 14px;background:#fff}
.card{background:var(--panel);border-radius:20px;padding:20px 28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:40px}
.fbar{position:relative;height:110px;background:#e5e7eb;border-radius:16px;overflow:hidden}
.fbar .fill{height:100%;background:var(--green);transition:width .6s ease;min-width:8px}
.fnums{display:flex;justify-content:space-between;margin-top:10px;font-size:34px;font-weight:800}
.fnums .s{color:var(--green)} .fnums .t{color:var(--muted)}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 40px}
.row{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:14px}
.name{font-size:30px;font-weight:700}
.track{position:relative;height:60px;background:#f3f4f6;border-radius:12px}
.bar{height:100%;border-radius:12px;min-width:6px;background:var(--blue);transition:width .6s ease}
.val{position:absolute;top:50%;transform:translateY(-50%);font-size:32px;font-weight:800;padding:0 14px}
.val.in{color:#fff}
.stamp{color:var(--muted);font-size:17px}
.err{color:#b91c1c;font-weight:600}
@media (max-width:900px){
  main{padding:14px 16px}
  .rows{grid-template-columns:1fr}
  .card h2{font-size:30px}
  .fbar{height:76px}
  .fnums{font-size:26px}
  .name{font-size:24px}
  .track{height:50px}
  .val{font-size:26px}
}
</style>
</head>
<body>
<main>
<header>
  <a class="back" href="../" id="backLink">Back to scoring</a>
  <span class="stamp" id="stamp">Loading</span>
</header>

<section class="card"><h2>Fights scored</h2>
  <div class="fbar"><div class="fill" id="ffill" style="width:0"></div></div>
  <div class="fnums"><span class="s" id="fscored">&ndash; scored</span><span class="t" id="ftotal">&ndash; total</span></div>
</section>
<section class="card"><h2>Clips scored</h2><div class="rows" id="scoredRows"></div></section>
</main>

<script>
"use strict";
(() => {
const R2_BASE = "https://clips.brysonloflin.com";
const API_KEY = "AIzaSyBosL_Hib9s81f4Hlhw3GLq_XZDNkZEnSk";
const PROJECT = "bryson-website-games";
const WHO = {                                   // same keys as the scorer page (CONTRACT.md v2)
  Laura: "hf65vyb7cd45nfxm87d8nddy",
  Dante: "aazm3zcrsmtmjsnkxcdvg5xm",
  Bryson: "3f4ke72hhgc43nh7ka6pwzxk",
  Other: "fpt2j5gzw9zhps9923hrs9qw"            // was Tobias until 11/5; anyone else, one shared pool
};
const $ = id => document.getElementById(id);
if (location.search) $("backLink").href = "../" + location.search;

function done(a) {
  if (!a.tags_right || !a.type) return false;
  if (a.type === "fight") return !!a.fight_level && !!a.winner;
  return true;
}
async function totals() {
  const r = await fetch(`${R2_BASE}/stats.json`, { cache: "no-store" });
  if (!r.ok) throw new Error("stats " + r.status);
  return r.json();
}
async function answers(key) {
  const out = {};
  let token = "";
  do {
    const u = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/scoring/${key}/answers`
      + `?key=${API_KEY}&pageSize=300` + (token ? `&pageToken=${encodeURIComponent(token)}` : "");
    const r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error("answers " + r.status);
    const j = await r.json();
    for (const d of j.documents || []) {
      const f = {};
      for (const [k, v] of Object.entries(d.fields || {})) f[k] = v.stringValue ?? v.integerValue ?? "";
      out[d.name.split("/").pop()] = f;
    }
    token = j.nextPageToken || "";
  } while (token);
  return out;
}
function bars(el, cls, data) {
  const max = Math.max(1, ...data.map(d => d.n));
  el.innerHTML = data.map(d => {
    const pct = 100 * d.n / max, inside = pct > 18;
    return `<div class="row"><span class="name">${d.name}</span><div class="track">`
      + `<div class="bar" style="width:${pct}%"></div>`
      + `<span class="val ${inside ? "in" : ""}" style="${inside ? "left:0" : `left:${pct}%`}">${d.n}</span></div></div>`;
  }).join("");
}
async function refresh() {
  try {
    const names = Object.keys(WHO);
    const [t, res] = await Promise.all([totals(), Promise.all(names.map(async n => {
      const a = await answers(WHO[n]);
      return { name: n, n: Object.values(a).filter(done).length };
    }))]);
    const f = Number(t.fights) || 0, fs = Number(t.fights_scored) || 0;
    $("ffill").style.width = (f ? 100 * fs / f : 0) + "%";
    $("fscored").textContent = fs.toLocaleString() + " scored";
    $("ftotal").textContent = f.toLocaleString() + " total";
    bars($("scoredRows"), "", res);
    $("stamp").className = "stamp";
    $("stamp").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) {
    $("stamp").className = "stamp err";
    $("stamp").textContent = "Offline, retrying";
  }
}
refresh();
setInterval(refresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
