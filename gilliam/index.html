<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Gilliam drafts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%231a73e8'/%3E%3Crect x='10' y='10' width='12' height='2' fill='%23fff'/%3E%3Crect x='10' y='15' width='12' height='2' fill='%23fff'/%3E%3Crect x='10' y='20' width='8' height='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f1f3f4; --page: #fff; --ink: #202124; --muted: #5f6368; --faint: #80868b;
  --line: #dadce0; --accent: #1a73e8; --accent-soft: #e8f0fe;
  --hl: #fdeaa8; --hl-on: #fbcf4f; --pend: #c6dafc;
  --ins: #137333; --ins-bg: #e6f4ea; --del: #b3261e; --over: #d93025; --ok: #188038;
  --card: #fff; --shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 56px; }
.top .brand { font-weight: 600; font-size: 16px; color: var(--ink); white-space: nowrap; }
.top .brand:hover { text-decoration: none; }
.top .crumb { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: 13px; color: var(--muted); background: #fff; white-space: nowrap; }
button.chip:hover { background: var(--bg); }
.chip.owner { border-color: var(--accent); color: var(--accent); }

/* hub */
.hub { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
.hub h1 { font-size: 26px; font-weight: 600; margin: 4px 0 6px; }
.hub .lede { color: var(--muted); margin: 0 0 22px; max-width: 640px; }
.list { background: #fff; border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: 34px minmax(0,1fr) 170px 150px; gap: 14px; align-items: center;
  padding: 14px 18px; border-top: 1px solid var(--line); color: var(--ink); }
.row:first-child { border-top: 0; }
.row:hover { background: #f8f9fa; text-decoration: none; }
.row .num { color: var(--faint); font-variant-numeric: tabular-nums; }
.row .t { font-weight: 600; font-size: 15px; }
.row .p { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .notes { font-size: 13px; color: var(--muted); text-align: right; }
.row .notes b { color: var(--ink); font-weight: 600; }
.wc { font-size: 13px; font-variant-numeric: tabular-nums; }
.wc .n { font-weight: 600; }
.wc.over .n { color: var(--over); }
.bar { height: 4px; background: #e8eaed; border-radius: 2px; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.wc.over .bar i { background: var(--over); }

/* essay view */
.wrap { max-width: 1140px; margin: 0 auto; padding: 18px 20px 80px; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; font-size: 14px; }
.grid { display: grid; grid-template-columns: minmax(0, 780px) 300px; gap: 22px; justify-content: center; }
.prompt { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 18px 22px; margin-bottom: 14px; }
.prompt h1 { font-size: 21px; font-weight: 600; margin: 0 0 10px; }
.lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 3px; }
.prompt p { margin: 0 0 12px; color: #3c4043; }
.counts { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: flex-end; }
.counts .wc { min-width: 180px; }
.counts .wc .big { font-size: 20px; }
.counts .alt { font-size: 13px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
.tools .hint { color: var(--muted); font-size: 13px; margin-right: auto; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 12px; color: var(--ink); font-size: 13px; }
.btn:hover { background: #f8f9fa; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { background: #1765cc; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: #fff; padding: 5px 10px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.page { background: var(--page); box-shadow: var(--shadow); padding: 56px 68px 72px; min-height: 60vh;
  font: 15px/1.6 Arial, Helvetica, sans-serif; white-space: pre-wrap; overflow-wrap: break-word; }
.page .hl { background: var(--hl); border-bottom: 2px solid #f7c948; cursor: pointer; }
.page .hl.on, .page .sg.on { background: var(--hl-on); }
.page .sg { color: var(--del); text-decoration: line-through; text-decoration-thickness: 1px; cursor: pointer; }
.page.clean .sg { color: inherit; text-decoration: none; background: var(--ins-bg); border-bottom: 2px dotted var(--ins); }
.page .sg.hl { background: var(--hl); }
.page .ins { color: var(--ins); text-decoration: underline; text-decoration-thickness: 1px; cursor: pointer; }
.page .ins.on { background: var(--hl-on); }
.page.clean .ins { display: none; }
.page .pend { background: var(--pend); }
.page .cr { display: none; }
.page sup { font-size: 70%; line-height: 0; }
.page .figwrap { display: block; margin: 8px 0 0; }
.page .figwrap img { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
.editor { width: 100%; min-height: 70vh; border: 0; outline: 2px solid var(--accent); resize: vertical;
  font: 15px/1.6 Arial, Helvetica, sans-serif; padding: 56px 68px; box-shadow: var(--shadow); color: var(--ink); }

/* margin + cards */
.margin { position: relative; }
.card { position: absolute; left: 0; right: 0; background: var(--card); border-radius: 8px; box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 13px; transition: top .18s ease, transform .18s ease; cursor: default; }
.card.on { transform: translateX(-10px); box-shadow: 0 2px 6px rgba(60,64,67,.3), 0 4px 12px 2px rgba(60,64,67,.15); z-index: 2; }
.card.closed { opacity: .72; }
.card .ch { display: flex; align-items: flex-start; gap: 8px; }
.av { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; font-size: 13px; }
.card .who { flex: 1; min-width: 0; line-height: 1.25; }
.card .who b { display: block; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .who small { color: var(--faint); font-size: 12px; }
.card .acts { display: flex; gap: 2px; }
.ib { border: 0; background: transparent; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.ib:hover { background: var(--bg); }
.ib.ok { color: var(--ok); }
.ib.no { color: var(--del); }
.card .q { margin: 8px 0 0; color: var(--muted); font-size: 12px; border-left: 3px solid var(--hl-on); padding-left: 8px; white-space: pre-wrap; }
.card .sgx { margin: 8px 0 0; white-space: pre-wrap; }
.card .sgx del { color: var(--del); }
.card .sgx ins { color: var(--ins); text-decoration: none; background: var(--ins-bg); }
.card .tx { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: break-word; }
.card .st { margin-top: 8px; font-size: 12px; color: var(--muted); }
.card .rep { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
.card .rep .who b { display: inline; }
.card .rb { display: none; margin-top: 10px; }
.card.on .rb { display: block; }
.card .detach { margin-top: 6px; font-size: 12px; color: var(--del); }
.card textarea, .card input { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; resize: vertical; }
.card textarea:focus, .card input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.card .row2 { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
.card .f { margin-top: 8px; }
.card .f .lbl { margin-bottom: 4px; }
.card.compose { border-left: 3px solid var(--accent); z-index: 3; }
.empty-m { color: var(--faint); font-size: 13px; padding: 4px 2px; }

/* selection bubble, toast, dialogs */
.bubble { position: fixed; z-index: 40; display: none; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(60,64,67,.35);
  padding: 4px; gap: 2px; }
.bubble.show { display: flex; }
.bubble button { border: 0; background: #fff; border-radius: 6px; padding: 7px 11px; font-size: 13px; color: var(--ink); display: flex; gap: 6px; align-items: center; }
.bubble button:hover { background: var(--accent-soft); color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #202124; color: #fff;
  padding: 10px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; transform: translateX(-50%); }
dialog { border: 0; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 0; width: min(760px, 94vw); max-height: 86vh; }
dialog::backdrop { background: rgba(32,33,36,.45); }
.dlg { display: flex; flex-direction: column; max-height: 86vh; }
.dlg header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600; }
.dlg .body { overflow: auto; padding: 14px 18px; }
.dlg .vrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.dlg .vrow:hover { background: #f8f9fa; }
.dlg pre { white-space: pre-wrap; font: 14px/1.55 Arial, sans-serif; margin: 0; }
.center { max-width: 520px; margin: 18vh auto; background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 28px; text-align: center; }
.center h1 { font-size: 20px; margin: 0 0 8px; }
.center p { color: var(--muted); margin: 0; }
.loading { color: var(--muted); padding: 40px; text-align: center; }

@media (max-width: 1000px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .margin { position: static; }
  .card { position: relative; top: auto !important; margin-bottom: 10px; }
  .card.on { transform: none; outline: 2px solid var(--accent); }
  .mhead { display: block !important; }
}
@media (max-width: 700px) {
  .top { padding: 8px 16px; }
  .top .crumb, #due, .nav .prev, .nav .dot { display: none; }
  .top { gap: 8px; }
  #namechip { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .hub, .wrap { padding-left: 16px; padding-right: 16px; }
  .row { grid-template-columns: minmax(0,1fr) auto; }
  .row .num { display: none; }
  .row .notes { grid-column: 2; grid-row: 1; }
  .row .wc { grid-column: 1 / -1; }
  .page, .editor { padding: 26px 20px 36px; font-size: 16px; }
  .prompt { padding: 16px; }
}
.mhead { display: none; font-weight: 600; margin: 18px 0 8px; }

/* True-size page measurement for the page-limited pieces: US Letter, 1-inch margins,
   Arial 11 pt, single-spaced (Word's "single" for Arial is 1.15 x the font size), 6 pt after
   each paragraph, figures 6.5 in wide. Arimo is Arial's metric twin, used where Arial isn't installed. */
.measure { position: absolute; left: -10000px; top: 0; visibility: hidden; pointer-events: none; }
.pflow { width: 6.5in; font-family: Arial, Arimo, "Liberation Sans", Helvetica, sans-serif; font-size: 11pt; line-height: 1.15; color: #000; }
.pflow p { margin: 0 0 6pt; white-space: pre-wrap; overflow-wrap: break-word; }
.pflow sup { font-size: 7pt; line-height: 0; }
.pflow .pfig { margin: 0 0 6pt; }
.pflow .pfig img, .pflow .pfig i { display: block; width: 6.5in; }
.pflow .pfig i { background: #f1f3f4; }
.sheets { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sheetbox { position: relative; flex: none; }
.sheet { position: absolute; left: 0; top: 0; width: 8.5in; height: 11in; padding: 1in; background: #fff;
  box-shadow: var(--shadow); transform-origin: top left; }
.sheet .clip { overflow: hidden; }
.sheet .pno { position: absolute; left: 0; right: 0; bottom: .45in; text-align: center; font: 9pt Arial, sans-serif; color: var(--faint); }
.sheet .marg { position: absolute; inset: 1in; outline: 1px dashed #e0e3e7; pointer-events: none; }
.sheet.over { box-shadow: 0 0 0 4px var(--over); }
.sheet .overtag { position: absolute; top: .4in; left: 1in; right: 1in; color: var(--over); font: 600 13pt system-ui, sans-serif; }
.fmtnote { font-size: 12px; color: var(--faint); margin-top: 4px; }

/* suggesting mode: type on the page, changes show as tracked edits */
.page.suggesting { outline: 2px solid var(--ins); caret-color: var(--ins); cursor: text; }
.page.suggesting:focus { outline-width: 3px; }
.page .s-ins { color: var(--ins); background: var(--ins-bg); text-decoration: underline; text-decoration-thickness: 1px; }
.page .s-del { color: var(--del); text-decoration: line-through; text-decoration-thickness: 1px; user-select: none; -webkit-user-select: none; }
.btn.sug { border-color: var(--ins); color: var(--ins); }
.seg button.on.sug { background: var(--ins-bg); color: var(--ins); }
.card.static { position: relative; top: auto !important; margin-bottom: 10px; }
.card.ref { cursor: pointer; }
.card.ref:hover { box-shadow: 0 1px 3px rgba(60,64,67,.35), 0 4px 10px rgba(60,64,67,.18); }
.card.ref .go { margin-top: 6px; font-size: 12px; color: var(--accent); }
.mlabel { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 2px 8px; }
.page .flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 35% { background: var(--hl-on); box-shadow: 0 0 0 3px var(--hl-on); } 100% { box-shadow: 0 0 0 0 transparent; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&display=swap">
</head>
<body>
<div class="top">
  <a class="brand" href="#/">Gilliam 2027</a>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="chip" id="due" title="HHMI deadline: Tuesday, October 27, 2026, 11:59 PM ET"></span>
  <span class="chip owner" id="ownerchip" hidden>Owner</span>
  <button class="chip" id="namechip" type="button"></button>
</div>
<main id="app"><div class="loading">Loading…</div></main>
<div class="bubble" id="bubble">
  <button type="button" data-k="comment">💬 Comment</button>
  <button type="button" data-k="suggest">✎ Suggest edit</button>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script>
(function () {
"use strict";
// API: same origin when the Worker serves the page, otherwise the Worker's address.
const REMOTE = "https://gilliam-review.nypenntrack.workers.dev";
const API = (/workers\.dev$/.test(location.hostname) || location.port === "8787") ? "" : REMOTE;
const DEADLINE = new Date("2026-10-27T23:59:00-04:00");

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
// Access keys arrive in the link's #fragment once, then live in this browser.
(function takeKeys() {
  const h = location.hash.slice(1);
  if (!/(^|&)k=/.test(h)) return;
  const p = new URLSearchParams(h);
  if (p.get("k")) ls.set("gl-k", p.get("k"));
  if (p.get("o")) ls.set("gl-o", p.get("o"));
  history.replaceState(null, "", location.pathname + location.search + "#/" + (p.get("p") || ""));
})();
const KEY = ls.get("gl-k"), OWNER = ls.get("gl-o") || "";
let CLIENT = ls.get("gl-c");
if (!CLIENT) { CLIENT = Math.random().toString(36).slice(2) + Date.now().toString(36); ls.set("gl-c", CLIENT); }

const S = { essays: null, essay: null, notes: [], top: [], owner: false, active: null, pending: null, sel: null,
  view: ls.get("gl-view") || "inline", showClosed: false, editing: false, fig: null, sig: "",
  layout: ls.get("gl-layout") || "draft", figAspect: 735 / 1950, mode: "comment", draft: null, undo: [], redo: [] };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $("#app");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const words = (s) => (s || "").trim().split(/\s+/).filter(Boolean).length;
const fmt = (n) => n.toLocaleString("en-US");
const hue = (s) => { let h = 0; for (const c of s || "?") h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (name) => `<span class="av" style="background:hsl(${hue(name)} 50% 42%)">${esc((name || "?").trim().charAt(0).toUpperCase())}</span>`;
function ago(t) {
  if (!t) return "";
  const d = (Date.now() - new Date(t).getTime()) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " h ago";
  if (d < 86400 * 6) return Math.floor(d / 86400) + " d ago";
  return new Date(t).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}
function name() { return ls.get("gl-name") || ""; }
function paintName() {
  $("#namechip").textContent = name() ? "👤 " + name() : "Set your name";
  $("#ownerchip").hidden = !S.owner;
}
$("#namechip").onclick = () => {
  const n = prompt("Your name (shown on your comments):", name());
  if (n != null && n.trim()) { ls.set("gl-name", n.trim().slice(0, 60)); paintName(); }
};
(function due() {
  const d = Math.ceil((DEADLINE - Date.now()) / 86400000);
  $("#due").textContent = d > 1 ? `Due Oct 27 · ${d} days` : d === 1 ? "Due tomorrow" : d === 0 ? "Due today" : "Submitted?";
})();

async function api(path, opt = {}) {
  const r = await fetch(API + "/api" + path, {
    method: opt.method || "GET",
    headers: { "content-type": "application/json", "x-key": KEY || "", "x-owner": OWNER, "x-client": CLIENT },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(data.error || "Something went wrong (" + r.status + ")."); err.status = r.status; throw err; }
  return data;
}

// Same anchoring rule as the server: find the quote, prefer the copy whose neighbours match.
function anchor(body, quote, prefix, suffix, hint) {
  if (!quote) return -1;
  prefix = prefix || ""; suffix = suffix || "";
  let best = -1, bestScore = -Infinity;
  for (let i = body.indexOf(quote); i !== -1; i = body.indexOf(quote, i + 1)) {
    let s = 0;
    for (let k = 1; k <= prefix.length && i - k >= 0 && body[i - k] === prefix[prefix.length - k]; k++) s++;
    const e = i + quote.length;
    for (let k = 0; k < suffix.length && e + k < body.length && body[e + k] === suffix[k]; k++) s++;
    const score = s * 1e6 - Math.abs(i - (hint || 0));
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}

// ---------- page length ----------
// Pieces with a page limit (no word limit, "N page(s)" in the limit note) are laid out at true
// size in a hidden box and paginated the way Word would: lines break across pages, a figure moves
// whole to the next page, and widow/orphan control keeps at least two lines of a paragraph together.
const FORMAT_NOTE = "Measured at true size: US Letter, 1-inch margins, Arial 11 pt, single-spaced, 6 pt after paragraphs, figure 6.5 in wide.";

    p.trim() === "[Figure 1]"
      ? `<div class="pfig" data-fig>${S.fig ? `<img alt="" src="${S.fig}" style="height:${figH}px">` : `<i style="height:${figH}px"></i>`}</div>`
      : `<p>${supify(p)}</p>`).join("");

    } else {

      let i = 0;

        if (i + k >= n) break;

        if (rest >= 2) { if (rest - k === 1) k--; if (k === 1) k = 0; }   // widow / orphan control

    : `About ${fmt(st.room)} line${st.room === 1 ? "" : "s"} of room left`;

      iv.push({ s: n.pos + t.a, e: n.pos + n.quote.length - t.b, id: n.id, kind: n.kind, rep: t.ins });
    } else iv.push({ s: n.pos, e: n.pos + n.quote.length, id: n.id, kind: n.kind, rep: n.replacement });
  }
  if (S.pending) iv.push({ s: S.pending.s, e: S.pending.e, id: "pending", kind: "pending" });
  const cuts = new Set([0, body.length]);
  iv.forEach((x) => { cuts.add(x.s); cuts.add(x.e); });
  const figAt = S.essay.has_fig ? body.indexOf("[Figure 1]") : -1;
  if (figAt >= 0) cuts.add(figAt + 10);
  const pts = [...cuts].sort((a, b) => a - b);
  const insAt = (z) => iv.filter((x) => x.kind === "suggest" && x.e === z && x.rep)
    .map((x) => `<span class="ins${x.id === S.active ? " on" : ""}" data-x="1" data-n="${x.id}">${esc(x.rep)}</span>`).join("");
  const caret = /\^[0-9,–-]+\^/.test(body);
  let sup = false, html = insAt(0);
  const chars = (t) => {
    if (!caret) return esc(t);
    let out = "", run = "";
    const flush = () => { if (run) out += sup ? `<sup>${esc(run)}</sup>` : esc(run); run = ""; };
    for (const ch of t) {
      if (ch === "^") { flush(); out += '<span class="cr">^</span>'; sup = !sup; } else run += ch;
    }
    flush();
    return out;
  };
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], z = pts[k + 1];
    const cov = iv.filter((x) => x.s <= a && x.e >= z && x.e > x.s);
    const inner = chars(body.slice(a, z));
    if (cov.length) {
      const cls = new Set();
      cov.forEach((x) => {
        cls.add(x.kind === "comment" ? "hl" : x.kind === "suggest" ? "sg" : "pend");
        if (x.id === S.active) cls.add("on");
      });
      html += `<span class="${[...cls].join(" ")}" data-n="${cov.map((x) => x.id).join(" ")}">${inner}</span>`;
    } else html += inner;
    html += insAt(z);
    if (figAt >= 0 && z === figAt + 10 && S.fig) html += `<span class="figwrap" data-x="1"><img alt="Figure 1" src="${S.fig}"></span>`;
  }
  const box = $("#docbox");
  box.innerHTML = `<article class="page ${S.view === "clean" ? "clean" : ""}" id="doc">${html}</article>`;
  box.querySelectorAll("img").forEach((im) => im.addEventListener("load", layoutCards));
}

function firstText(n) {
  if (!n) return null;
  if (n.nodeType === 3) return n;
  const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
  return w.nextNode();
}
function lastText(n) {
  if (n.nodeType === 3) return n;
  const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
  let t = null, x;
  while ((x = w.nextNode())) t = x;
  return t;
}
function textOffset(root, node, off) {

    if (off < node.childNodes.length) { node = firstText(node.childNodes[off]); off = 0; }
    else { node = lastText(node); off = node ? node.length : 0; }
    if (!node) return null;
  }
  let total = 0;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let t = w.nextNode(); t; t = w.nextNode()) {
    const extra = t.parentElement && t.parentElement.closest("[data-x]");
    if (t === node) return extra ? total : total + off;
    if (!extra) total += t.length;
  }
  return null;
}

// ---------- margin ----------
// Read-only copies of the open comments, shown beside the editor and in suggesting mode.
// Clicking one finds its text in whatever is on the page (the textarea or the suggesting draft).
function refCards() {
  const ns = S.top.filter((n) => n.status === "open")
    .sort((a, b) => (a.pos < 0 ? -1 : a.pos) - (b.pos < 0 ? -1 : b.pos) || a.created_at.localeCompare(b.created_at));
  if (!ns.length) return "";
  const short = (x, k) => (x.length > k ? x.slice(0, k) + "…" : x);
  return `<div class="mlabel">Comments and suggestions (${ns.length})</div>` + ns.map((n) => {
    const reps = S.notes.filter((r) => r.parent_id === n.id);

      <div class="ch">${avatar(n.author)}<div class="who"><b>${esc(n.author)}</b><small>${n.kind === "suggest" ? "Suggested edit · " : ""}${ago(n.created_at)}</small></div></div>
      ${n.kind === "suggest" ? sugText(n.quote, n.replacement || "", short) : `<div class="q">${esc(short(n.quote, 160))}</div>`}
      ${n.text ? `<div class="tx">${esc(n.text)}</div>` : ""}
      ${reps.map((r) => `<div class="rep"><div class="ch">${avatar(r.author)}<div class="who"><b>${esc(r.author)}</b> <small>${ago(r.created_at)}</small></div></div><div class="tx">${esc(r.text)}</div></div>`).join("")}
      <div class="go">${n.pos < 0 ? "The text this pointed to has changed." : "Show in text ↑"}</div></div>`;

function centerOnRect(rect) {

  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}
// Normal view: bring the highlighted text into view and pulse it.
function jumpToNote(id) {

// Editing or suggesting: find the note's text in the current version and select it.
function findRef(id) {
  const n = S.top.find((x) => x.id === id);
  if (!n) return;
  if (S.editing) {
    const ed = $("#editor");
    if (!ed) return;
    const i = anchor(ed.value, n.quote, n.prefix, n.suffix, n.start);
    if (i < 0) return toast("That text has changed since this was written.");
    ed.blur(); ed.setSelectionRange(i, i + n.quote.length); ed.focus();
    // put the selected line in the middle of the editor box, then the box in the middle of the screen
    const lh = parseFloat(getComputedStyle(ed).lineHeight) || 24;
    const before = ed.value.slice(0, i), cols = Math.max(20, Math.floor(ed.clientWidth / (lh * 0.42)));
    const lines = before.split("\n").reduce((a, l) => a + Math.max(1, Math.ceil(l.length / cols)), 0);
    ed.scrollTop = Math.max(0, lines * lh - ed.clientHeight / 2);
    const r = ed.getBoundingClientRect();
    if (r.top < 0 || r.bottom > window.innerHeight) ed.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (S.mode === "suggest") {
    const doc = $("#sdoc");
    if (!doc) return;
    const i = anchor(S.draft, n.quote, n.prefix, n.suffix, n.start);
    if (i < 0) return toast("That text has changed in your draft.");
    const pt = (k) => {
      const w = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT, {
        acceptNode: (t) => (t.parentElement.closest("[data-del]") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });

      while ((t = w.nextNode())) { last = t; if (cum + t.length >= k) return [t, k - cum]; cum += t.length; }
      return last ? [last, last.length] : [doc, 0];
    };
    const r = document.createRange();
    r.setStart(...pt(i)); r.setEnd(...pt(i + n.quote.length));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    centerOnRect(r.getBoundingClientRect());
  }
}
function noteCard(n) {

const narrow = () => window.matchMedia("(max-width: 1000px)").matches;
function layoutCards() {
  const m = $("#margin"), doc = $("#doc");
  if (!m || !doc) return;
  const cards = [...m.querySelectorAll(".card")];
  if (narrow()) { m.style.minHeight = ""; return; }
  const mTop = m.getBoundingClientRect().top;
  const want = cards.map((c) => {
    const el = doc.querySelector(`[data-n~="${c.dataset.id}"]`);
    return el ? el.getBoundingClientRect().top - mTop : 0;
  });
  const h = cards.map((c) => c.offsetHeight);
  const top = new Array(cards.length);
  let y = 0;
  for (let i = 0; i < cards.length; i++) { top[i] = Math.max(want[i], y); y = top[i] + h[i] + 10; }
  // pull the active card level with its text, pushing its neighbours out of the way
  const a = cards.findIndex((c) => c.classList.contains("on"));
  if (a >= 0 && top[a] > want[a]) {
    top[a] = Math.max(0, want[a]);
    for (let i = a - 1; i >= 0; i--) top[i] = Math.min(top[i], top[i + 1] - h[i] - 10);
    const shift = top[0] < 0 ? -top[0] : 0;
    if (shift) for (let i = 0; i <= a; i++) top[i] += shift;
    for (let i = a + 1; i < cards.length; i++) top[i] = Math.max(top[i], top[i - 1] + h[i - 1] + 10);
  }
  cards.forEach((c, i) => { c.style.top = top[i] + "px"; });
  const last = cards.length ? top[cards.length - 1] + h[cards.length - 1] : 0;
  m.style.minHeight = last + 20 + "px";
}

app.addEventListener("click", async (ev) => {

async function act(a, card, btn) {
  const id = card && card.dataset.id;
  const nameIn = card && card.querySelector(".nm");
  if (nameIn && nameIn.value.trim()) { ls.set("gl-name", nameIn.value.trim().slice(0, 60)); paintName(); }
  try {
    if (a === "cancel") { S.pending = null; renderDoc(); renderMargin(); return; }
    if (a === "post") {
      if (!name()) { toast("Please add your name first."); return; }
      const p = S.pending, text = (card.querySelector(".ct") || {}).value || "";
      const rep = p.kind === "suggest" ? card.querySelector(".rp").value : undefined;
      if (p.kind === "comment" && !text.trim()) { toast("The comment is empty."); return; }
      if (p.kind === "suggest" && rep === p.quote) { toast("Change the text to suggest an edit."); return; }
      btn && (btn.disabled = true);
      const r = await api(`/essays/${encodeURIComponent(S.essay.id)}/notes`, { method: "POST", body: {
        kind: p.kind, quote: p.quote, prefix: p.prefix, suffix: p.suffix, start: p.s, replacement: rep, text, author: name() } });
      S.pending = null;
      await refresh(r.id);
      toast(p.kind === "suggest" ? "Suggestion added" : "Comment added");
      return;
    }
    if (a === "reply") {
      const ta = card.querySelector(".rt");
      if (!ta.value.trim()) return;
      if (!name()) { toast("Please add your name first."); return; }
      await api(`/essays/${encodeURIComponent(S.essay.id)}/notes`, { method: "POST", body: { parent_id: id, text: ta.value, author: name() } });
      await refresh(id);
      return;
    }
    if (a === "resolve" || a === "reopen" || a === "accept" || a === "reject") {
      const status = { resolve: "resolved", reopen: "open", accept: "accepted", reject: "rejected" }[a];
      await api(`/notes/${id}/status`, { method: "POST", body: { status, author: name() || (S.owner ? "Bryson" : "") } });
      await refresh(a === "reopen" ? id : null);
      toast({ resolved: "Resolved", open: "Re-opened", accepted: "Accepted and applied to the text", rejected: "Rejected" }[status]);
      return;
    }
    if (a === "del") {
      if (!confirm("Delete this and its replies?")) return;
      await api(`/notes/${id}`, { method: "DELETE" });
      await refresh(null);
      return;
    }
    if (a === "delrep") {
      const rid = btn.closest("[data-rid]").dataset.rid;
      if (!confirm("Delete this reply?")) return;
      await api(`/notes/${rid}`, { method: "DELETE" });
      await refresh(id);
    }

    toast(e.message);
    if (btn) btn.disabled = false;
    if (e.status === 409) await refresh(null);
  }
}
async function refresh(activeId) {

async function tool(t) {
  if (t === "msuggest") {
    if (S.mode === "suggest") return;
    S.mode = "suggest"; S.draft = S.essay.body; S.undo = []; S.redo = []; S.pending = null; S.active = null; hideBubble();
    renderAll(); return;
  }
  if (t === "mcomment" || t === "sdiscard") {
    if (S.mode !== "suggest") return;
    const n = hunks(S.essay.body, S.draft).length;
    if (n && !confirm(`Discard your ${n} unposted change${n === 1 ? "" : "s"}?`)) return;
    S.mode = "comment"; S.draft = null; renderAll(); return;
  }
  if (t === "spost") return postSuggestions($("[data-t=spost]"));
  if (t === "draft" || t === "pages") { S.layout = t; ls.set("gl-layout", t); S.pending = null; hideBubble(); renderAll(); return; }
  if (t === "inline" || t === "clean") { S.view = t; ls.set("gl-view", t); renderTools(); renderDoc(); layoutCards(); return; }
  if (t === "closed") { S.showClosed = !S.showClosed; renderAll(); return; }
  if (t === "copy") {
    try { await navigator.clipboard.writeText(S.essay.body.replace(/\^[0-9,–-]+\^/g, "")); toast("Copied the current text"); }
    catch (e) { toast("Your browser blocked copying."); }
    return;
  }
  if (t === "edit") { S.editing = true; S.pending = null; hideBubble(); renderAll(); return; }
  if (t === "cancel") { S.editing = false; renderAll(); return; }
  if (t === "save") {
    const v = $("#editor").value;
    try {
      await api("/essays/" + encodeURIComponent(S.essay.id), { method: "PUT", body: { body: v, base_version: S.essay.version } });
      S.editing = false; await refresh(null); toast("Saved");
    } catch (e) { toast(e.message); }
    return;
  }
  if (t === "versions") return versions();
}

    if (rs) {
      const v = await api(`/essays/${encodeURIComponent(S.essay.id)}/versions/${rs.dataset.restore}`);
      try {
        await api("/essays/" + encodeURIComponent(S.essay.id), { method: "PUT", body: { body: v.body, base_version: S.essay.version } });
        dlg.close(); await refresh(null); toast("Restored version " + v.version);
      } catch (e) { toast(e.message); }
    }
  };
}

// ---------- selection → bubble ----------
const bubble = $("#bubble");
function hideBubble() { bubble.classList.remove("show"); S.sel = null; }
function onSelection() {
  const doc = $("#doc");
  if (!doc || S.editing || S.pending) return hideBubble();
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return hideBubble();
  const r = sel.getRangeAt(0);
  if (!doc.contains(r.startContainer) || !doc.contains(r.endContainer)) return hideBubble();
  let s = textOffset(doc, r.startContainer, r.startOffset), e = textOffset(doc, r.endContainer, r.endOffset);
  if (s == null || e == null) return hideBubble();
  if (e < s) [s, e] = [e, s];
  const body = S.essay.body;
  while (s < e && /\s/.test(body[s])) s++;
  while (e > s && /\s/.test(body[e - 1])) e--;
  if (e <= s) return hideBubble();
  S.sel = { s, e };
  const rect = r.getBoundingClientRect();
  bubble.classList.add("show");
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  if (window.matchMedia("(pointer: coarse)").matches) {
    bubble.style.left = (window.innerWidth - bw) / 2 + "px";
    bubble.style.top = window.innerHeight - bh - 18 + "px";
  } else {
    bubble.style.left = Math.min(window.innerWidth - bw - 8, Math.max(8, rect.left + rect.width / 2 - bw / 2)) + "px";
    bubble.style.top = (rect.top - bh - 8 > 64 ? rect.top - bh - 8 : rect.bottom + 8) + "px";
  }
}
let st;
document.addEventListener("selectionchange", () => { clearTimeout(st); st = setTimeout(onSelection, 150); });
window.addEventListener("scroll", () => { if (S.sel) onSelection(); }, { passive: true });
bubble.addEventListener("mousedown", (e) => e.preventDefault());
bubble.addEventListener("click", (e) => {
  const b = e.target.closest("[data-k]");
  if (!b || !S.sel) return;
  const { s, e: end } = S.sel, body = S.essay.body;
  S.pending = { kind: b.dataset.k, s, e: end, quote: body.slice(s, end), prefix: body.slice(Math.max(0, s - 32), s), suffix: body.slice(end, end + 32) };
  S.active = "pending";
  getSelection().removeAllRanges();
  hideBubble();
  renderDoc(); renderMargin();
  if (narrow()) { const c = $(".card.compose"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); }
});

// ---------- live updates from other readers ----------
setInterval(async () => {
  if (document.hidden || !KEY) return;
  const busy = S.pending || S.editing || S.mode === "suggest" || (document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName) && document.activeElement.value);
  if (busy || (S.sel && !getSelection().isCollapsed)) return;
  try {
    if (route().type === "essay" && S.essay) {
      const before = S.sig, act = S.active;
      await loadEssay(S.essay.id);
      if (S.sig !== before) { S.active = S.top.some((n) => n.id === act) ? act : null; renderAll(); }
    } else if (route().type === "hub" && $(".hub")) {
      const d = await api("/essays");
      if (JSON.stringify(d.essays) !== JSON.stringify(S.essays)) { S.essays = d.essays; $(".list").innerHTML = d.essays.map(hubRow).join(""); }
    }
  } catch (e) {}
}, 30000);

paintName();
go();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.essay && S.mode !== "suggest" && pageLimit(S.essay) && route().type === "essay" && !S.editing && $("#counts")) { renderCounts(); if (pagesMode()) renderPages(); } });
})();
</script>
</body>
